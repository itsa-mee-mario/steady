<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady: predictable screen, shape-shifting space</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header><h1>Steady</h1><span class="pill" id="mic"></span><button class="ghost" id="sm" aria-label="Smaller text">A−</button><button class="ghost" id="bg" aria-label="Bigger text">A+</button><button class="ghost" id="hc" aria-label="High contrast">◐</button><button class="ghost" id="lg"></button><button class="ghost" id="role"></button></header>
<main id="v"></main>
<div id="story"></div>
<div class="bar" id="bar"><button class="btn mic" id="talk"></button><input id="in" aria-label="Type here" autocomplete="off"><button class="ghost" id="go"></button></div>
<nav id="nav"></nav>
<script src="app.js"></script></body></html>
